name: Build

on:
  workflow_dispatch:
    inputs:
      testx_choice:
        description: 'TesX'
        default: 'x'
        type: choice
        options:
          - 'x'
          - 'xx'

jobs:
  Build:
    runs-on: windows-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      ENV_CONFS: ${{ secrets.ENV_CONFS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
    
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: 1mnt/nomnt
          token: ${{ secrets.GH_PAT }}
          path: nomnt

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_KEYX }}
          hostname: ${{ inputs.testx_choice }}
          tags: tag:ci

      - name: Download Resource
        run: |
          Move-Item -Path "nomnt" -Destination "D:\"
          "D:\nomnt\install.ps"
 
      - name: Build
        run: |
          "D:\nomnt\install.ps" -s
