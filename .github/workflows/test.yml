name: Build

on:
  workflow_dispatch:
    inputs:
      testx_choice:
        description: 'TesX'
        default: 'x'
        type: choice
        options:
          - 'x'
          - 'xx'

jobs:
  Build:
    runs-on: windows-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      ENVSETUPC: ${{ secrets.ENVSETUPC }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: 1mnt/nomnt
          token: ${{ secrets.GH_PAT }}

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_KEYX }}
          hostname: ${{ inputs.testx_choice }}
          tags: tag:ci

      - name: Download Resource
        uses: robinraju/release-downloader@v1.13
          with:
          repository: "1mnt/romnt"
          latest: true
          preRelease: true
          fileName: "*"

      - name: Setup
        run: .\install.ps1
 
      - name: Build
        run: .\install.ps1 -s
